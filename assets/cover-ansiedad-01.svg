<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img"
     aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Pack Ansiedad 01 — Respira. Un camino en calma para tu mente.</title>
  <desc id="desc">Cubierta en papel cream con figura abstracta orgánica en verde pino y terracota.</desc>

  <!-- Fondo papel -->
  <rect width="640" height="800" fill="#F5EFE3"/>

  <!-- Grano de papel (textura generativa, sin asset externo) -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0.06 0"/>
  </filter>
  <rect width="640" height="800" filter="url(#grain)" opacity="0.5" style="mix-blend-mode: multiply;"/>

  <!-- Marco interior en arena -->
  <rect x="40" y="40" width="560" height="720" fill="none"
        stroke="#E4DAC8" stroke-width="2"/>

  <!-- Mancha orgánica en pino: silueta de colina serena -->
  <path d="M60 560 C 150 470, 210 540, 300 500
           C 380 464, 430 520, 530 470
           L 600 500 L 600 760 L 60 760 Z"
        fill="#1F3D33" opacity="0.9"/>

  <!-- Onda de calma en terracota -->
  <path d="M60 640 C 160 600, 240 680, 340 640
           C 420 610, 520 660, 600 622"
        fill="none" stroke="#C15837" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="2 10" opacity="0.85"/>

  <!-- Sol/Semilla: círculo terracota (forma primaria, sin icono) -->
  <circle cx="470" cy="250" r="64" fill="#C15837" opacity="0.9"/>
  <circle cx="470" cy="250" r="92" fill="none" stroke="#C15837" stroke-width="2" opacity="0.5"/>
  <circle cx="470" cy="250" r="120" fill="none" stroke="#C15837" stroke-width="1" opacity="0.3"/>

  <!-- Título con serif del sistema (sin asset externo, regenerable por pack) -->
  <text x="118" y="300" font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="700" fill="#1F3D33" letter-spacing="-1">
    Ansiedad<tspan x="118" dy="78" font-size="76">01</tspan>
  </text>

  <!-- Sub: promesa de calma -->
  <text x="122" y="430" font-family="Georgia, serif" font-size="26" fill="#2B2620">
    Respira. Un camino en calma para tu mente.
  </text>
</svg>
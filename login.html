<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Inicia sesión en TiendaAudioBlaze para ver tus packs comprados.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Entrar — TiendaAudioBlaze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- SDK de supabase-js v2 (carga directa aquí: el form lo necesita ya). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header container" role="banner">
    <p class="brand">
      <img src="assets/logo.png" alt="" width="56" height="56">
      <span class="brand-text">TiendaAudioBlaze<small>audio de psicología</small></span>
    </p>
    <nav class="header-links" aria-label="Navegación principal">
      <a href="index.html#catalogo">Catálogo</a>
      <a href="mis-packs.html">Mis packs</a>
      <span class="auth-nav" id="auth-nav"></span>
    </nav>
  </header>

  <main role="main" class="container">
    <section class="auth-section" aria-labelledby="login-titulo">
      <div class="auth-card">
        <h1 id="login-titulo">Entrar</h1>
        <p>Vuelve a tu cuenta para ver los packs que ya compraste.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Correo</label>
            <input type="email" id="login-email" name="email" autocomplete="email"
                   placeholder="tu@correo.com" required>
          </div>

          <div class="field">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password"
                   autocomplete="current-password" placeholder="••••••••" required>
          </div>

          <button class="btn btn-primary" id="login-btn" type="submit"
                  style="width:100%;min-height:48px">Entrar</button>

          <p class="form-error" id="login-error" hidden role="alert"></p>
        </form>

        <div class="auth-nav-whoami">
          ¿Aún no tienes cuenta?
          <a href="registro.html" id="to-register">Regístrate gratis</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>© 2026 TiendaAudioBlaze · <a href="refunds.html">Política de reembolso</a></p>
      <p><a href="mailto:hola@tiendaaudioblaze.com">hola@tiendaaudioblaze.com</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    // Preserva el destino de la URL actual al saltar a "Regístrate".
    (function () {
      var p = new URLSearchParams(window.location.search);
      var n = p.get('next') || sessionStorage.getItem('auth.next') || 'index.html';
      var a = document.getElementById('to-register');
      if (a) a.href = 'registro.html?next=' + encodeURIComponent(n);
    })();
  </script>
</body>
</html>
